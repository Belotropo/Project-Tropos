<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropos | Detalle del Producto</title>
    <!-- ENLACE AL ARCHIVO CSS EXTERNO -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- El mismo encabezado para mantener la consistencia -->
    <header>
        <div class="header-left">
            <div class="logo">TROPOS</div>
            <nav>
                <a href="index.html">Shop</a>
                <a href="#">New Arrivals</a>
                <a href="#">Collections</a>
            </nav>
        </div>
        <div class="header-right">
            <span>Admin</span>
            <a href="#" class="btn-black">Sign Up</a>
        </div>
    </header>

    <main>
        <!-- Simulación de navegación: Enlace para volver -->
        <a href="index.html" class="back-link">← Volver a Productos</a>

        <div class="product-detail-container">
            <!-- Imagen del producto -->
            <div class="product-detail-image">
                <img src="[https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80](https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80)" alt="Classic Cotton T-Shirt">
            </div>

            <!-- Información del producto y acciones -->
            <div class="product-detail-info">
                <div>
                    <p class="product-category">Tops</p>
                    <h1 style="font-size: 32px; margin: 10px 0;">Classic Cotton T-Shirt</h1>
                    <p class="product-price" style="font-size: 24px;">$29.99</p>
                </div>

                <p style="color: #555; line-height: 1.6;">Premium cotton t-shirt with modern fit. Ideal for everyday wear.</p>

                <div>
                    <h3 style="font-size: 14px; margin-bottom: 10px;">Selecciona tu Talla</h3>
                    <div class="size-selector">
                        <button class="size-btn">XS</button>
                        <button class="size-btn" style="background: black; color: white;">S</button>
                        <button class="size-btn">M</button>
                        <button class="size-btn">L</button>
                        <button class="size-btn">XL</button>
                    </div>
                </div>

                <button class="btn-black btn-large">Add to Cart</button>
            </div>
        </div>
    </main>

</body>
</html>
